<!DOCTYPE html>
<html>
  <head>
    <title>Workspace demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@luigi-project/core@latest/luigi.css" />
  </head>
  <body>
    <noscript>Enable JavaScript to use this app.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/@luigi-project/core@latest/luigi.js"></script>
    <script type="module">
      import { workspaceData as workspace, endpointsData } from './config/app-config.js';

      const frontendUrl = 'http://localhost:9000';
      const user = workspace.user;
      const children = [];
      if (user.permissions.some(permission => permission.startsWith('MANAGE_'))) {
        children.push({
          pathSegment: 'management', label: 'Management', icon: 'action-settings',
          viewUrl: frontendUrl + '#/management',
        });
      }
      for (const endpoint of endpointsData) {
        children.push({
          category: { label: 'Links', icon: 'link' },
          label: endpoint.id,
          externalLink: { url: endpoint.url },
        });
      }
      Luigi.setConfig({
        navigation: {
          profile: { staticUserInfoFn: () => ({ name: user.name }) },
          nodes: () => [{
            pathSegment: 'home', label: workspace.name, icon: 'home',
            viewUrl: frontendUrl + '#/home', children, context: { workspace },
          }],
        },
        routing: { useHashRouting: true },
        settings: {
          customSandboxRules: ['allow-downloads'],
          header: { title: `Workspace: ${workspace.name} / User: ${user.name}`, logo: '/logo.svg' },
          hideNavigation: false,
          responsiveNavigation: 'semiCollapsible',
        },
      });
    </script>
  </body>
</html>
