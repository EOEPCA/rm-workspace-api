default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        entry: scripts/check-secrets.sh
        always_run: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.4
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint-docker
        entry: ghcr.io/igorshubovych/markdownlint-cli:v0.39.0@sha256:d994ac260316939ec7e2fb63b07ff6266754aa9ab64976d1e63948fb89f81772
        args: [--disable, MD013, MD024, --]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args:
          ["--failure-threshold=warning", "--ignore=DL3008", "--ignore=DL3013"]

  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked --extra dev --extra prod ruff check .
        language: system
        files: '(^pyproject\.toml$|^uv\.lock$|\.pyi?$)'
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev --extra prod ruff format --check .
        language: system
        files: '(^pyproject\.toml$|^uv\.lock$|\.pyi?$)'
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --locked --extra dev --extra prod mypy .
        language: system
        files: '(^pyproject\.toml$|^uv\.lock$|\.pyi?$)'
        pass_filenames: false
      - id: copyright-header
        name: Copyright header
        entry: ./scripts/copyright.py
        types_or: [python]
        language: system
